<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg{fill:#ffffff}
    .surface{fill:#f8fafc}
    .muted{fill:#6b7280}
    .text{fill:#0f172a;font-family:Inter, Arial, sans-serif}
    .primary{fill:#2563eb}
    .card{fill:#ffffff;stroke:#e6eef3;stroke-width:1;}
    .pill{fill:#eef2ff;stroke:#dbeafe;}
  </style>
  <rect class="bg" width="1200" height="760"/>

  <!-- Header shortcut -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" stroke="#e6eef3"/>
  <text x="36" y="40" class="text" font-size="18" font-weight="700">VnE – Homepage (Light mockup)</text>

  <!-- Hero -->
  <rect x="36" y="90" width="1128" height="320" rx="8" fill="#f3f4f6" stroke="#e6eef3"/>
  <rect x="56" y="110" width="720" height="280" rx="6" fill="#dbeafe"/>
  <text x="800" y="150" class="text" font-size="28" font-weight="700">Hero headline: Tin nổi bật hôm nay</text>
  <text x="800" y="190" class="muted" font-size="14">Mô tả ngắn gọn, tóm tắt nội dung chính ở đây để thu hút người đọc.</text>
  <rect x="800" y="210" width="140" height="38" rx="6" class="primary" />
  <text x="825" y="235" fill="#ffffff" font-family="Inter, Arial" font-size="14">Đọc ngay</text>

  <!-- Carousel dots -->
  <g transform="translate(36, 430)">
    <circle cx="560" cy="12" r="6" fill="#2563eb"/>
    <circle cx="590" cy="12" r="6" fill="#c7d2fe"/>
    <circle cx="620" cy="12" r="6" fill="#c7d2fe"/>
  </g>

  <!-- Main content columns -->
  <rect x="36" y="470" width="760" height="240" fill="#ffffff" stroke="#e6eef3"/>
  <rect x="812" y="470" width="352" height="240" fill="#ffffff" stroke="#e6eef3"/>

  <!-- Left: Article grid (3 cards) -->
  <g transform="translate(52,488)">
    <rect x="0" y="0" width="220" height="120" rx="8" class="card"/>
    <rect x="240" y="0" width="220" height="120" rx="8" class="card"/>
    <rect x="480" y="0" width="220" height="120" rx="8" class="card"/>

    <text x="12" y="18" class="muted" font-size="12">Tag</text>
    <text x="12" y="100" class="text" font-size="16" font-weight="600">Tiêu đề bài viết 1</text>

    <text x="252" y="18" class="muted" font-size="12">Tag</text>
    <text x="252" y="100" class="text" font-size="16" font-weight="600">Tiêu đề bài viết 2</text>

    <text x="492" y="18" class="muted" font-size="12">Tag</text>
    <text x="492" y="100" class="text" font-size="16" font-weight="600">Tiêu đề bài viết 3</text>
  </g>

  <!-- Right: Sidebar trending / newsletter -->
  <g transform="translate(820,488)">
    <rect x="12" y="8" width="328" height="90" rx="6" fill="#f8fafc" stroke="#e6eef3"/>
    <text x="24" y="34" class="text" font-size="14" font-weight="700">Trending</text>
    <text x="24" y="54" class="muted" font-size="12">1. Bài hot nhất</text>
    <text x="24" y="70" class="muted" font-size="12">2. Bài đáng chú ý</text>

    <rect x="12" y="110" width="328" height="110" rx="6" fill="#f8fafc" stroke="#e6eef3"/>
    <text x="24" y="140" class="text" font-size="14" font-weight="700">Đăng ký nhận tin</text>
    <rect x="24" y="160" width="240" height="34" rx="6" fill="#ffffff" stroke="#e6eef3"/>
    <rect x="270" y="160" width="70" height="34" rx="6" class="primary"/>
    <text x="292" y="182" fill="#ffffff" font-size="12">Đăng ký</text>
  </g>

  <!-- Footer mock small -->
  <rect x="0" y="730" width="1200" height="30" fill="#f8fafc"/>
  <text x="36" y="750" class="muted" font-size="12">© Mockup — Homepage layout</text>
</svg>